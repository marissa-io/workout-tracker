<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
</head>
<body>
    <header class="title">
    <h1>WORKOUT TRACKER</h1>
    <h2><i>Strength Training Edition</i></h2>
    </header>

    <main>
    <section>

    <div class="top-buttons">

        <button onclick="window.location.href='index.html'">
            Home
        </button>
        <button onclick="window.location.href='create.html'">
            Create New    +  
        </button>
</div>

        <h2 id="workout-history">Workout History</h2>

        <div class="search-bar">
        <input type="text" id="search-workout" placeholder="Search workout by name">
        
        <div class="filter-by">
        <label for="filter-by">Filter by:</label>
        <select id="filter-by">
           <option value="date-newest">Newest to Oldest</option>     
           <option value="date-oldest">Oldest to Newest</option>     
           <option value="name-AZ">Workout name (A-Z)</option>     
           <option value="name-ZA">Workout name (Z-A)</option>     
        </select>
        </div>
    </div>  

<div class="workout-header">
    <div class="workout-info-titles">
        <p>Date</p>
<p>Exercise Name</p>
    </div>
<p >Actions</p>

</div>


        <!-- add filter selector somewhere next to search bar -->
        <div class="workout-card">
            <!-- FAKE WORKOUT INFO DELETE LATER -->
             <div class="workout-info">
            <p class="spec-date">July 20, 2026</p>
            <p class="spec-exercise-name">Bench Press</p>
            </div>

            <div class="workout-buttons">
            <button>Edit</button>
            <button>Delete</button>
            </div>

        </div>

    </section>
    </main>
     <footer>
        <p>2026 Workout Tracker: Version 1.0</p>
    </footer>
</body>
</html>
