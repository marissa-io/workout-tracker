<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Workout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
      <header class="title">
    <h1>WORKOUT TRACKER</h1>
    <h2><i>Strength Training Edition</i></h2>
    </header>


    <main>
        <div class="topButtons">
            <button onclick="window.location.href='index.html'">Home</button>
            <button onclick="window.location.href='history.html'">Search</button>
        </div>

    <!-- this will need to change according to if the user clicks create or edit -->
    <h2 id="pageTitle">CREATE WORKOUT ENTRY</h2>

    <div class="pageLayout">
        <form onsubmit="return addWorkoutEntry(this)">
            <div class="formDiv">
            <label for="exerciseName">Exercise Name: </label>
            <input type="text" id="exerciseName" name="exerciseName">
            </div>

            <div class="formDiv">
            <label for="weight">Weight(lbs): </label>
            <input type="number" id="weight" name="weight">
            </div>
            
            <div class="formDiv">
            <label for="sets">Total Sets: </label>
            <input type="number" id="sets" name="sets">
            </div>
            
            <div class="formDiv">
            <label for="reps">Repetition Count: </label>
            <input type="number" id="reps" name="reps">
            </div>
            
            <div class="formDiv">
            <label for="dateCompleted">Date Completed: </label>
            <input type="date" id="dateCompleted" name="dateCompleted">
            </div>
 
        <button type="submit">Save Workout</button>

        </form>




    <section id="previousEntry">
        <h3>Previous Workouts</h3>
        <article>
            <div id="previousWorkouts"></div>
        </article>

        <!-- Save for JavaScript -->
        <!-- needs to display all previous workouts that have identicsal names to the one being created/edited -->
    </section>  
    </div>
    </main>

     <footer>
        <p>2026 Workout Tracker: Version 1.0</p>
    </footer>

    <!-- https://www.geeksforgeeks.org/html/how-to-link-javascript-file-to-a-separate-html-file/ -->
     <script src="create.js"></script>
</body>
</html>
