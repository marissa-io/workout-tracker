<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History</title>
</head>
<body>
    <header class="title">
    <h1>WORKOUT TRACKER</h1>
    <h2><i>Strength Training Edition</i></h2>
    </header>

    <main>
    <section>

    <div class="topButtons">

        <button onclick="window.location.href='index.html'">
            Home
        </button>
        <button onclick="newWorkout()">
            Create New    +  
        </button>
</div>

        <h2 id="workoutHistory">Workout History</h2>

        <div class="searchBar">
        <input type="text" id="searchWorkout" placeholder="Search workout by name">
        
        <div class="filterBy">
        <label for="sortWorkouts">Filter by:</label>
        <select id="sortWorkouts">
           <option value="dateNewest">Newest to Oldest</option>     
           <option value="dateOldest">Oldest to Newest</option>     
           <option value="nameAZ">Workout name (A-Z)</option>     
           <option value="nameZA">Workout name (Z-A)</option>     
        </select>
        </div>
    </div>  

<div class="workoutHeader">
    <div class="workoutInfoTitles">
        <p>Date</p>
<p>Exercise Name</p>
    </div>
<p >Actions</p>

</div>

       
            <div id="workoutList"></div>

        </div>

    </section>
    </main>
     <footer>
        <p>2026 Workout Tracker: Version 1.0</p>
    </footer>

        <script src="history.js"></script>
</body>
</html>
